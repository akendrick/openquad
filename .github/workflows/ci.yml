name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        env:
          QT_LIBS: libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
        # Skip the slow package-list refresh unless the install needs it; retry downloads.
        run: |
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 $QT_LIBS \
            || (sudo apt-get update -o Acquire::Retries=3 \
                && sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 $QT_LIBS)
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  swift:
    # The native Mac core must keep matching the Python reference (test vectors).
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: swift --version
      - run: swift test --package-path swift/OpenQuadCore
      - run: swift test --package-path swift/OpenQuadApp
      - run: swift/sign-app.sh  # builds the app and signs it ad hoc (no secrets in CI)
